<style>
:root { color-scheme: light dark; --bg: #f6f1e4; --panel: #fffdf7; --ink: #1f2430; --line: #c9bfa8; --accent: #b3261e; }
@media (prefers-color-scheme: dark) { :root { --bg: #141a2a; --panel: #1e2638; --ink: #eef1f7; --line: #3b4660; --accent: #ffb4ab; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
  background: var(--bg); color: var(--ink); font: 20px/1.6 system-ui, -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; }
body.checking form { visibility: hidden; }
form { display: flex; flex-direction: column; gap: 12px; width: min(420px, 100%); background: var(--panel);
  border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
p { margin: 0; }
input, button { font: inherit; min-height: 48px; border-radius: 8px; }
input { padding: 0 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
button { border: 0; background: var(--ink); color: var(--bg); font-weight: 600; cursor: pointer; }
#gate-err { color: var(--accent); font-weight: 600; }
</style>

  <button type="submit">進入</button>
  <p id="gate-busy" role="status" hidden>解開中，請稍等…</p>
  <p id="gate-err" role="alert" hidden></p>
</form>

<script type="module">
const gate = JSON.parse(document.getElementById("udl-gate").textContent);
const sealed = JSON.parse(document.getElementById("udl-sealed").textContent);
const KEY_SLOT = "udl-site-key:" + gate.salt;
const unb64 = (t) => Uint8Array.from(atob(t), (c) => c.charCodeAt(0));
const b64 = (u) => btoa(String.fromCharCode(...u));
const store = {
  get(k) { try { return sessionStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { sessionStorage.setItem(k, v); } catch { /* 沒有 sessionStorage 就每頁都問 */ } },
};
async function keyFromPassword(password) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: unb64(gate.salt), iterations: gate.iterations },
    base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
async function open(key) {
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(sealed.iv) }, key, unb64(sealed.data));
  const page = JSON.parse(new TextDecoder().decode(plain));
  if (page.gate) store.set("udl-gate", page.gate);
  const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
  store.set(KEY_SLOT, b64(raw));
  document.open();
  document.write(page.html);
  document.close();
}
async function tryStored() {
  const saved = store.get(KEY_SLOT);
  if (!saved) return false;
  try {
    const key = await crypto.subtle.importKey("raw", unb64(saved), "AES-GCM", true, ["decrypt"]);
    await open(key);
    return true;
  } catch { return false; }
}
const form = document.getElementById("gate-form");
const err = document.getElementById("gate-err");
const busy = document.getElementById("gate-busy");
function showForm() { document.body.classList.remove("checking"); document.getElementById("gate-input").focus(); }
if (!window.crypto || !crypto.subtle) {
  document.body.classList.remove("checking");
  err.textContent = "這個瀏覽器環境無法解開教材，請用 https 網址開啟。";
  err.hidden = false;
} else {
  tryStored().then((ok) => { if (!ok) showForm(); });
}
form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  err.hidden = true;
  busy.hidden = false;
  try {
    await open(await keyFromPassword(document.getElementById("gate-input").value));
  } catch {
    busy.hidden = true;
    err.textContent = "密碼不對。";
    err.hidden = false;
  }
});
</script>
